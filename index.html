<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MusicCam</title><style>
*{box-sizing:border-box}body{margin:0;background:#10131b;color:#f4f6fa;font:16px system-ui,sans-serif}main{max-width:640px;margin:auto;padding:18px}h1{margin:0;color:#8ee5d0}p{color:#b9c2d1}video{width:100%;max-height:48vh;background:#000;border-radius:16px;object-fit:contain}#preview{transform:scaleX(-1)}section{background:#1d2330;border-radius:14px;padding:16px;margin:12px 0}button,a.save{border:0;border-radius:10px;padding:14px;color:#10131b;background:#8ee5d0;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none}button:disabled{opacity:.35}#stop{background:#ff8d92}label{display:block;margin:12px 0}input[type=range]{width:100%;accent-color:#8ee5d0}input[type=file]{max-width:100%}.row{display:flex;gap:10px;flex-wrap:wrap}small{color:#b9c2d1}#status{white-space:pre-wrap} [hidden]{display:none!important}</style></head><body><main><h1>MusicCam</h1><p>Record your performance with a backing track.</p><video id="preview" autoplay muted playsinline></video><section><button id="enable">Enable camera & microphone</button><label>Backing track <input id="file" type="file" accept="audio/*"></label><small id="track">No track selected</small><label>Headphone volume <span id="hv">80%</span><input id="head" type="range" min="0" max="1" step=".01" value=".8"></label><label>Music in recording <span id="mv">70%</span><input id="music" type="range" min="0" max="1" step=".01" value=".7"></label><label>Voice in recording <span id="vv">100%</span><input id="voice" type="range" min="0" max="2" step=".01" value="1"></label><div class="row"><button id="record" disabled>● Record</button><button id="stop" disabled>■ Stop</button></div><p id="status" role="status">Connect headphones, select music and enable the camera.</p><small>Headphones are recommended. Android controls which physical microphone is used.</small></section><section id="result" hidden><h2>Your recording</h2><video id="playback" controls playsinline></video><p><a class="save" id="save">Save video</a></p></section></main><script>
'use strict';const $=id=>document.getElementById(id);let stream,ctx,buffer,rec,source,monitor,musicGain,voiceGain,dest,outputUrl,started,timer,busy=false,loading=false;const status=s=>$('status').textContent=s;function ready(){ $('record').disabled=busy||loading||!stream||!buffer; $('enable').disabled=busy||!!stream; $('file').disabled=busy; $('stop').disabled=!rec||rec.state!=='recording'; }function audio(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx;}for(const [id,display] of [['head','hv'],['music','mv'],['voice','vv']]){$(id).oninput=()=>{$(display).textContent=Math.round(100*$(id).value)+'%';if(monitor)monitor.gain.value=+$('head').value;if(musicGain)musicGain.gain.value=+$('music').value;if(voiceGain)voiceGain.gain.value=+$('voice').value;};}
$('enable').onclick=async()=>{busy=true;ready();try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Open this page over HTTPS in Chrome.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});$('preview').srcObject=stream;status('Camera ready. Select a backing track.');}catch(e){status('Camera/microphone error: '+e.message);}finally{busy=false;ready();}};
$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;loading=true;buffer=null;ready();try{buffer=await audio().decodeAudioData(await f.arrayBuffer());$('track').textContent=f.name+' · '+Math.round(buffer.duration)+' seconds';status('Track ready. Recording starts from the beginning.');}catch(e){$('track').textContent='Could not load track';status(e.message);}finally{loading=false;ready();}};
function cleanup(){clearInterval(timer);try{source?.stop();}catch{}for(const n of [source,monitor,musicGain,voiceGain])try{n?.disconnect();}catch{}if(dest)dest.stream.getTracks().forEach(t=>t.stop());source=monitor=musicGain=voiceGain=dest=null;}
$('record').onclick=async()=>{if(busy||!stream||!buffer)return;busy=true;ready();let mic,limiter;try{if(!window.MediaRecorder)throw Error('MediaRecorder is unavailable in this browser.');await audio().resume();dest=ctx.createMediaStreamDestination();source=ctx.createBufferSource();source.buffer=buffer;monitor=ctx.createGain();musicGain=ctx.createGain();voiceGain=ctx.createGain();monitor.gain.value=+$('head').value;musicGain.gain.value=+$('music').value;voiceGain.gain.value=+$('voice').value;limiter=ctx.createDynamicsCompressor();limiter.threshold.value=-3;limiter.knee.value=0;limiter.ratio.value=20;source.connect(monitor).connect(ctx.destination);source.connect(musicGain).connect(limiter);mic=ctx.createMediaStreamSource(stream);mic.connect(voiceGain).connect(limiter);limiter.connect(dest);const combined=new MediaStream([...stream.getVideoTracks(),...dest.stream.getAudioTracks()]);const types=['video/mp4;codecs=avc1.420034,mp4a.40.2','video/mp4','video/webm;codecs=vp8,opus','video/webm'];const mime=types.find(t=>MediaRecorder.isTypeSupported(t));rec=new MediaRecorder(combined,{...(mime?{mimeType:mime}:{}),videoBitsPerSecond:4000000});const chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};rec.onerror=e=>{status('Recording error: '+(e.error?.message||'unknown'));if(rec.state!=='inactive')rec.stop();};rec.onstop=()=>{const type=rec.mimeType||chunks[0]?.type||'video/webm';const blob=new Blob(chunks,{type});cleanup();mic.disconnect();limiter.disconnect();rec=null;busy=false;ready();if(!blob.size){status('No recording data received.');return;}if(outputUrl)URL.revokeObjectURL(outputUrl);outputUrl=URL.createObjectURL(blob);$('playback').src=outputUrl;$('save').href=outputUrl;$('save').download='MusicCam-'+Date.now()+(type.includes('mp4')?'.mp4':'.webm');$('result').hidden=false;status('Recording ready. Save your video.');};rec.start(250);source.start();started=Date.now();timer=setInterval(()=>{const s=Math.floor((Date.now()-started)/1000);status('Recording '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'));},250);status('Recording…');ready();}catch(e){if(rec&&rec.state!=='inactive'){rec.stop();return;}cleanup();mic?.disconnect();limiter?.disconnect();rec=null;busy=false;ready();status('Recording error: '+e.message);}};
$('stop').onclick=()=>{if(rec?.state==='recording'){clearInterval(timer);try{source.stop();}catch{}rec.stop();$('stop').disabled=true;status('Preparing video…');}};window.addEventListener('pagehide',()=>{stream?.getTracks().forEach(t=>t.stop());});ready();</script></body></html>
